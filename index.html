<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ausgaben">
<meta name="theme-color" content="#0b0f14">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon180.png">
<link rel="manifest" href="manifest.json">
<title>Ausgaben</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f14;color:rgba(238,242,246,.92);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  #app{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#0b0f14;visibility:hidden}
  body.open #app{visibility:visible}
  #lock{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 70% at 50% 30%,#132030 0%,#0b0f14 60%);z-index:10;transition:opacity .25s}
  body.open #lock{opacity:0;pointer-events:none}
  #lock img{width:84px;height:84px;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 40px rgba(255,176,46,.12)}
  #lock h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.01em}
  #lock p{margin:0;color:#7f8ba0;font-size:14px;text-align:center;max-width:270px}
  #btn{margin-top:8px;display:flex;align-items:center;gap:10px;padding:14px 24px;border-radius:999px;border:1px solid rgba(255,176,46,.45);background:rgba(20,28,38,.85);color:rgba(238,242,246,.95);font-family:inherit;font-weight:600;font-size:16px;box-shadow:0 0 30px rgba(255,176,46,.12)}
  #btn svg{color:#ffb02e}
  #btn:active{transform:scale(.97)}
</style>
</head>
<body>
<div id="lock">
  <img src="icon180.png" alt="">
  <h1>Gesperrt</h1>
  <p id="msg">Entsperren mit Face ID</p>
  <button id="btn" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9v1.5M15 9v1.5M12 9v4h-1M9.5 16a4 4 0 0 0 5 0"/></svg><span id="btnTxt">Entsperren</span></button>
</div>
<iframe id="app" title="Ausgaben" allow="clipboard-write"></iframe>
<script>
(function(){
  var APP = 'https://script.google.com/macros/s/AKfycbwUSpvqCHipBgJToQo-9HtqgaDhF8Gg71rygdwvl9VBhrJnjWjpgJNeUos7YzCq83DL/exec';
  var KEY = 'fa_cred', GRACE = 30000;
  var body = document.body, msg = document.getElementById('msg'), btn = document.getElementById('btn'), btnTxt = document.getElementById('btnTxt');
  var app = document.getElementById('app'), loaded = false, busy = false, hiddenAt = 0;

  function b64(buf){ var s = '', b = new Uint8Array(buf); for(var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s) }
  function unb64(str){ var s = atob(str), b = new Uint8Array(s.length); for(var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b }
  function rnd(n){ var b = new Uint8Array(n); crypto.getRandomValues(b); return b }
  function get(){ try{ return localStorage.getItem(KEY) }catch(e){ return null } }

  function open(){
    if(!loaded){ app.src = APP; loaded = true }
    body.classList.add('open');
  }
  function lock(){ body.classList.remove('open') }
  function ui(){
    if(!window.PublicKeyCredential){ msg.textContent = 'Face ID wird hier nicht unterstützt. Öffne die App über das Symbol auf dem Home-Bildschirm.'; btn.style.display = 'none'; return }
    if(get()){ msg.textContent = 'Entsperren mit Face ID'; btnTxt.textContent = 'Entsperren' }
    else { msg.textContent = 'Einmalig einrichten: Danach öffnet sich die App nur noch mit deinem Gesicht.'; btnTxt.textContent = 'Face ID einrichten' }
  }

  function setup(){
    return navigator.credentials.create({ publicKey: {
      challenge: rnd(32),
      rp: { name: 'Ausgaben' },
      user: { id: rnd(16), name: 'ausgaben', displayName: 'Ausgaben' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      timeout: 60000, attestation: 'none'
    }}).then(function(c){ try{ localStorage.setItem(KEY, b64(c.rawId)) }catch(e){} });
  }
  function verify(){
    return navigator.credentials.get({ publicKey: {
      challenge: rnd(32),
      allowCredentials: [{ type: 'public-key', id: unb64(get()), transports: ['internal'] }],
      userVerification: 'required', timeout: 60000
    }});
  }
  function unlock(){
    if(busy) return; busy = true;
    var p = get() ? verify() : setup();
    p.then(function(){ busy = false; ui(); open() })
     .catch(function(e){ busy = false; ui(); if(e && e.name !== 'NotAllowedError') msg.textContent = 'Das hat nicht geklappt – tippe nochmal.' });
  }

  btn.addEventListener('click', unlock);
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ hiddenAt = Date.now(); lock() }
    else if(hiddenAt && Date.now() - hiddenAt < GRACE && loaded){ open() }
    else if(get()){ unlock() }
  });
  ui();
  if(get()) unlock();
})();
</script>
</body>
</html>
